services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: simantap-app:latest
    ports:
      - "5174:80"
    restart: unless-stopped
    # Load environment variables from the .env file in the project root at runtime
    env_file:
      - .env
    environment:
      # Use NODE_ENV from .env if present, otherwise fall back to production
      - NODE_ENV=${NODE_ENV:-production}
