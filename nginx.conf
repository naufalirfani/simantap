## Redirect all HTTP traffic to HTTPS
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

## HTTPS server - replace certificate paths with your certs
server {
  listen 443 ssl http2;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Ensure cookies from proxied upstreams get recommended flags
  # requires nginx 1.19.3+ for `proxy_cookie_flags` directive
  proxy_cookie_flags ~ secure httponly samesite=Strict;

  # Static assets - explicitly return 404 for missing files
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|json|woff|woff2|ttf|eot|txt|pdf|xml|php)$ {
    try_files $uri =404;
    expires 1M;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Explicitly block known non-SPA paths to prevent 200 responses for 404s
  location ~ ^/(api|\.well-known|\.git) {
    return 404;
  }

  # SPA fallback: serve index.html for routes without file extensions
  # This prevents serving index.html for attempted file access
  location / {
    # For paths that look like files (have extensions), return 404
    if ($request_uri ~ \.[a-zA-Z0-9]+$) {
      return 404;
    }
    # For everything else, try to serve files/dirs, then fallback to index.html
    try_files $uri $uri/ /index.html;
  }

  # Optional: hide nginx version
  server_tokens off;

  # Security headers (only on HTTPS)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
}
