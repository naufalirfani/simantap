server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: serve index.html for any non-file route
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets caching
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|json)$ {
    try_files $uri =404;
    expires 1M;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Optional: hide nginx version
  server_tokens off;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
}
